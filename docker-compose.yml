services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dricash_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      - APP_NAME=Dricash
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://dricash.andrichadhea.my.id
      - DB_CONNECTION=mysql
    env_file:
      - path: .env
        required: false
    volumes:
      - dricash_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dricash_network

  # Database MySQL Container (Opsional - aktifkan jika tidak menggunakan Database Cloud Hostinger)
  # Cara aktifkan: docker compose --profile local-db up -d
  db:
    image: mysql:8.0
    container_name: dricash_db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-dricash}
      MYSQL_USER: ${DB_USERNAME:-dricash_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - dricash_db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - dricash_network

networks:
  dricash_network:
    name: dricash_net
    driver: bridge

volumes:
  dricash_storage:
    name: dricash_storage
  dricash_db_data:
    name: dricash_db_data
